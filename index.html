<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <title>NextUp</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0a0a0c] text-gray-300 font-sans antialiased min-h-[100dvh] flex flex-col items-center p-6 sm:p-8">

  <!-- =============================== -->
  <!-- INLOG SCHERM                    -->
  <!-- =============================== -->
  <div id="login-screen" class="w-full max-w-md hidden flex-grow">
    <div class="flex flex-col justify-center h-full min-h-[85vh]">
      <div class="bg-[#16161a] border border-white/5 rounded-[2.5rem] shadow-2xl p-8 sm:p-10 relative overflow-hidden w-full backdrop-blur-xl">
        
        <!-- Levendige zwevende achtergrond (Orb) -->
        <div class="absolute -top-10 -right-10 w-48 h-48 bg-purple-600/20 rounded-full blur-3xl pointer-events-none animate-float-slow"></div>
        <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-pink-600/10 rounded-full blur-3xl pointer-events-none animate-float-slow-reverse"></div>
        
        <!-- Dynamisch Logo Inlogscherm -->
        <div class="flex justify-center mb-6 relative z-10">
          <img src="icon.png" alt="NextUp Logo" class="w-24 h-24 logo-dynamic">
        </div>

        <!-- Shimmering Titel -->
        <h1 class="text-3xl font-light text-center mb-8 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-300 to-purple-400 relative z-10 animate-shimmer">NextUp</h1>
        
        <div class="mb-8 relative z-10">
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-3 ml-1">Wie ben jij?</label>
          <select id="input-name" class="w-full p-5 bg-black/50 border border-white/10 rounded-2xl outline-none focus:border-purple-500 text-gray-200 appearance-none text-lg transition-colors">
            <!-- Opties worden ingeladen via app.js -->
          </select>
        </div>

        <div class="mb-12 relative z-10">
          <label class="block text-xs uppercase tracking-wider text-gray-500 mb-3 ml-1">Pincode</label>
          <input type="password" id="input-pin" placeholder="• • • •" class="w-full p-5 bg-black/50 border border-white/10 rounded-2xl outline-none focus:border-purple-500 text-gray-200 text-center tracking-[1em] text-xl transition-colors">
        </div>

        <!-- Interactieve knop -->
        <button onclick="saveLogin()" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-medium py-5 px-4 rounded-2xl hover:opacity-90 transition-all relative z-10 shadow-lg shadow-purple-500/25 text-lg tracking-wide btn-press">
          Start App
        </button>
      </div>
    </div>
  </div>

  <!-- =============================== -->
  <!-- HOOFD SCHERM (DE APP)           -->
  <!-- =============================== -->
  <div id="app-screen" class="w-full max-w-md hidden flex-grow">
    <div class="flex flex-col h-full min-h-[90vh]">
      
      <!-- HEADER MET LOGO -->
      <div class="flex justify-between items-center pt-2 mb-8">
        <div class="flex items-center space-x-4">
          <!-- Dynamisch Logo App Scherm -->
          <img src="icon.png" alt="NextUp Logo" class="w-12 h-12 logo-dynamic">
          <div>
            <!-- Shimmering kleine titel -->
            <p class="text-xs uppercase tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 mb-1 animate-shimmer leading-none mt-1">NextUp</p>
            <h2 id="welcome-text" class="text-3xl font-light text-white leading-none">Hallo</h2>
          </div>
        </div>
        <button onclick="logout()" class="text-xs uppercase tracking-wider text-gray-500 hover:text-gray-300 transition-colors bg-white/5 hover:bg-white/10 border border-white/5 px-5 py-2.5 rounded-full btn-press">Uitloggen</button>
      </div>

      <!-- LADEN -->
      <div id="loading" class="flex-grow flex items-center justify-center text-gray-600">
        <p id="loading-text" class="animate-pulse font-light tracking-widest uppercase text-sm text-center px-4">Bezig met synchroniseren...</p>
      </div>

      <!-- CHALLENGE KAART -->
      <div id="challenge-card" class="bg-[#16161a] border border-white/5 rounded-[2.5rem] shadow-2xl p-8 sm:p-10 hidden relative overflow-hidden w-full my-auto backdrop-blur-xl">
        
        <div id="challenge-active" class="hidden relative z-10 flex-col items-center">
          <div class="flex items-center space-x-3 mb-8 w-full">
            <!-- Kloppende stip -->
            <div class="w-2.5 h-2.5 rounded-full bg-pink-500 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]"></div>
            <span id="cat-badge" class="text-sm font-medium text-pink-400 uppercase tracking-widest">Categorie</span>
          </div>
          
          <h3 class="text-4xl font-light text-white w-full mb-6 leading-tight glow-effect rounded-lg">Jouw beurt</h3>
          <p id="chal-text" class="text-gray-200 text-xl w-full mb-10 leading-relaxed font-light">De challenge tekst komt hier.</p>
          
          <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent mb-8"></div>
          
          <p class="text-xs text-center text-gray-500 uppercase tracking-widest mb-6 w-full">Geniet ervan</p>
          
          <!-- Interactieve knop (Andere Challenge) -->
          <button onclick="rejectChallenge()" class="mx-auto block text-xs uppercase tracking-widest text-white bg-gradient-to-r from-pink-600 to-rose-500 hover:from-pink-500 hover:to-rose-400 px-8 py-3.5 rounded-full transition-all shadow-lg shadow-pink-500/25 font-medium btn-press">
            Andere challenge
          </button>
        </div>
        
        <div id="challenge-waiting" class="hidden text-center py-10 relative z-10">
          <div class="w-24 h-24 bg-black/40 border border-white/5 rounded-full flex items-center justify-center mx-auto mb-8 shadow-inner relative overflow-hidden">
             <!-- Zachte puls binnenin de wacht-cirkel -->
             <div class="absolute inset-0 bg-purple-500/10 animate-pulse"></div>
            <svg class="w-10 h-10 text-purple-500/50 relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
          </div>
          <h3 class="text-2xl font-light text-white mb-4"><span id="partner-name" class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 font-medium">De ander</span> is aan de beurt</h3>
          <p class="text-gray-500 text-base font-light px-4">Leun achterover en laat je verrassen vandaag.</p>
        </div>
        
        <!-- Levendige achtergrond in de challenge kaart -->
        <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-pink-600/10 rounded-full blur-3xl pointer-events-none animate-float-slow"></div>
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-purple-600/10 rounded-full blur-3xl pointer-events-none animate-float-slow-reverse"></div>
      </div>

      <div class="mt-8"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
