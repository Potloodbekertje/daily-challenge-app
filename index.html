<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0c">
  <title>Daily Challenge</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hidden { display: none; }
    
    /* Zorgt voor een zachte glow achter de actieve challenge */
    .glow-effect {
      box-shadow: 0 0 40px -10px rgba(168, 85, 247, 0.4);
    }
  </style>
</head>
<body class="bg-[#0a0a0c] text-gray-300 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

  <!-- =============================== -->
  <!-- INLOG SCHERM                    -->
  <!-- =============================== -->
  <div id="login-screen" class="w-full max-w-md bg-[#16161a] border border-white/5 rounded-3xl shadow-2xl p-8 hidden relative overflow-hidden">
    <!-- Subtiele achtergrond glow in het paneel -->
    <div class="absolute -top-10 -right-10 w-32 h-32 bg-purple-600/20 rounded-full blur-3xl"></div>
    
    <h1 class="text-2xl font-medium text-center mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 relative z-10">Welkom terug</h1>
    
    <div class="mb-5 relative z-10">
      <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Wie ben jij?</label>
      <select id="input-name" class="w-full p-4 bg-black/50 border border-white/10 rounded-xl outline-none focus:border-purple-500 text-gray-200 appearance-none">
        <option value="" disabled selected>Selecteer je naam...</option>
        
        <!-- HIER_AANPASSEN: Vul hier jullie namen in -->
        <option value="Onno">Onno</option>
        <option value="Kelly">Kelly</option>
        
      </select>
    </div>

    <div class="mb-8 relative z-10">
      <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2">Pincode</label>
      <input type="password" id="input-pin" placeholder="• • • •" class="w-full p-4 bg-black/50 border border-white/10 rounded-xl outline-none focus:border-purple-500 text-gray-200 text-center tracking-[0.5em]">
    </div>

    <button onclick="saveLogin()" class="w-full bg-gradient-to-r from-purple-600 to-pink-500 text-white font-medium py-4 px-4 rounded-xl hover:opacity-90 transition relative z-10 shadow-lg shadow-purple-500/25">
      Start App
    </button>
  </div>

  <!-- =============================== -->
  <!-- HOOFD SCHERM (DE APP)           -->
  <!-- =============================== -->
  <div id="app-screen" class="w-full max-w-md hidden">
    
    <div class="flex justify-between items-center mb-10 px-2">
      <div>
        <p class="text-xs uppercase tracking-widest text-purple-400/80 mb-1">Daily Challenge</p>
        <h2 id="welcome-text" class="text-2xl font-light text-white">Hallo</h2>
      </div>
      <button onclick="logout()" class="text-xs text-gray-500 hover:text-gray-300 transition bg-white/5 border border-white/5 px-4 py-2 rounded-full">Uitloggen</button>
    </div>

    <div id="loading" class="text-center text-gray-600 py-12">
      <p class="animate-pulse font-light tracking-wide">Bezig met synchroniseren...</p>
    </div>

    <div id="challenge-card" class="bg-[#16161a] border border-white/5 rounded-[2rem] shadow-2xl p-8 hidden relative overflow-hidden">
      
      <div id="challenge-active" class="hidden relative z-10">
        <div class="flex items-center space-x-3 mb-6">
          <div class="w-2 h-2 rounded-full bg-pink-500 animate-pulse"></div>
          <span id="cat-badge" class="text-xs font-medium text-pink-400 uppercase tracking-widest">Categorie</span>
        </div>
        <h3 class="text-3xl font-light text-white mb-4 leading-tight glow-effect rounded-lg">Jouw beurt</h3>
        <p id="chal-text" class="text-gray-400 text-lg mb-8 leading-relaxed">De challenge tekst komt hier.</p>
        
        <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent mb-6"></div>
        <p class="text-xs text-center text-gray-600 uppercase tracking-widest">Geniet ervan</p>
      </div>
      
      <div id="challenge-waiting" class="hidden text-center py-8 relative z-10">
        <div class="w-20 h-20 bg-black/40 border border-white/5 rounded-full flex items-center justify-center mx-auto mb-6">
          <svg class="w-8 h-8 text-purple-500/50" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </div>
        <h3 class="text-xl font-light text-white mb-3"><span id="partner-name" class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 font-medium">De ander</span> is aan de beurt</h3>
        <p class="text-gray-500 text-sm font-light">Leun achterover en laat je verrassen vandaag.</p>
      </div>
      
      <!-- Subtiele glow onderin de kaart -->
      <div class="absolute -bottom-16 -left-16 w-40 h-40 bg-pink-600/10 rounded-full blur-3xl pointer-events-none"></div>
    </div>

  </div>

  <script>
    // HIER_AANPASSEN: Plak hieronder jouw gekopieerde Web-app URL
    const API_URL = "https://script.google.com/macros/s/AKfycbyFVB4kcZRTk8_KE3R-BDOsfUJcrh_01bOSbnI0MIp429bf9DempuKlKmTUg85SPkSG/exec";

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    const loginScreen = document.getElementById('login-screen');
    const appScreen = document.getElementById('app-screen');
    
    window.onload = () => {
      const savedName = localStorage.getItem('dc_name');
      const savedPin = localStorage.getItem('dc_pin');
      
      if (savedName && savedPin) {
        showAppScreen(savedName, savedPin);
      } else {
        loginScreen.classList.remove('hidden');
      }
    };

    function saveLogin() {
      const name = document.getElementById('input-name').value;
      const pin = document.getElementById('input-pin').value;
      
      if(!name || !pin) return;

      localStorage.setItem('dc_name', name);
      localStorage.setItem('dc_pin', pin);
      
      loginScreen.classList.add('hidden');
      showAppScreen(name, pin);
    }

    function logout() {
      localStorage.removeItem('dc_name');
      localStorage.removeItem('dc_pin');
      window.location.reload();
    }

    async function showAppScreen(name, pin) {
      appScreen.classList.remove('hidden');
      document.getElementById('welcome-text').innerText = "Hallo " + name;
      
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getToday', pin: pin })
        });
        
        const data = await response.json();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('challenge-card').classList.remove('hidden');

        if (data.error) {
          logout();
          return;
        }

        if (!data.challenge) {
          document.getElementById('challenge-waiting').classList.remove('hidden');
          document.getElementById('partner-name').innerText = "Niemand";
          return;
        }

        if (data.challenge.gebruiker === name) {
          document.getElementById('challenge-active').classList.remove('hidden');
          document.getElementById('cat-badge').innerText = data.challenge.categorie;
          document.getElementById('chal-text').innerText = data.challenge.challenge;
        } else {
          document.getElementById('challenge-waiting').classList.remove('hidden');
          document.getElementById('partner-name').innerText = data.challenge.gebruiker;
        }
        
      } catch (err) {
        logout();
      }
    }
  </script>
</body>
</html>
